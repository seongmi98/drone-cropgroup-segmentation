# DeepLab v3+ (ResNet-101) — 5-class crop semantic segmentation
# Detectron2 내장 DeepLab 사용 (별도 설치 불필요)

_BASE_: "../../detectron2/projects/DeepLab/configs/Cityscapes-SemanticSegmentation/Base-DeepLabV3-OS16-Semantic.yaml"

MODEL:
  META_ARCHITECTURE: "SemanticSegmentor"
  WEIGHTS: ""   # train 스크립트에서 덮어씀
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD:  [58.395,  57.120,  57.375]
  BACKBONE:
    NAME: "build_resnet_deeplab_backbone"
    FREEZE_AT: 0
  RESNETS:
    DEPTH: 101
    NORM: "BN"
    OUT_FEATURES: ["res2", "res5"]
    RES5_MULTI_GRID: [1, 2, 4]
    STEM_TYPE: "basic"
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: False
  SEM_SEG_HEAD:
    NAME: "DeepLabV3PlusHead"
    IN_FEATURES: ["res2", "res5"]
    PROJECT_FEATURES: ["res2"]
    PROJECT_CHANNELS: [48]
    ASPP_CHANNELS: 256
    ASPP_DILATIONS: [6, 12, 18]
    ASPP_DROPOUT: 0.1
    CONVS_DIM: 256
    NORM: "BN"
    COMMON_STRIDE: 4
    NUM_CLASSES: 5           # background + Cabbage + Radish + Onion + Garlic
    LOSS_TYPE: "hard_pixel_mining"
    IGNORE_VALUE: 255

INPUT:
  FORMAT: "RGB"
  MIN_SIZE_TRAIN: (512, 768, 1024, 1280, 1536)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TRAIN: 4096
  MAX_SIZE_TEST: 2048
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: [512, 512]
    SINGLE_CATEGORY_MAX_AREA: 1.0

SOLVER:
  BASE_LR: 0.01
  WEIGHT_DECAY: 0.0001
  MOMENTUM: 0.9
  MAX_ITER: 10000
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  WARMUP_ITERS: 200
  IMS_PER_BATCH: 2
  CHECKPOINT_PERIOD: 300

TEST:
  EVAL_PERIOD: 300
  AUG:
    ENABLED: False

DATALOADER:
  NUM_WORKERS: 4

SEED: 42
